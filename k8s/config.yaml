opnsense:
  url: "https://opnsense.example.com/api"
  key: "${OPNSENSE_API_KEY}"
  secret: "${OPNSENSE_API_SECRET}"
  verify_ssl: true
  interfaces:
    # Logical name -> OPNsense interface name
    # To find interface names, see README.md
    wan1: "wan"
    wan2: "opt1"

providers:
  hetzner:
    class: octodns_hetzner.HetznerProvider
    token: "${HCLOUD_TOKEN}"
    backend: hcloud

zones:
  example.com:
    providers: [hetzner]
    ttl: 300
    records:
      - name: office
        interfaces: [wan2]
      - name: home
        interfaces: [wan1]
      - name: server
        interfaces: [wan1, wan2]

settings:
  interval: 300 # seconds between checks
  health_port: 8080 # health endpoints for K8s probes
