apiVersion: apps/v1
kind: Deployment
metadata:
  name: wan-dns-sync
  labels:
    app: wan-dns-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wan-dns-sync
  template:
    metadata:
      labels:
        app: wan-dns-sync
    spec:
      automountServiceAccountToken: false  # set true when `kubernetes.enabled` needs the API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wan-dns-sync
          image: ghcr.io/ginsys/wan-dns-sync:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args:
            - --config
            - /etc/wan-dns-sync/config.yaml
          envFrom:
            - secretRef:
                name: wan-dns-sync-secrets
          ports:
            - containerPort: 8080
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/wan-dns-sync
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: config
          configMap:
            name: wan-dns-sync-config
