[project]
name = "wan-dns-sync"
version = "0.4.0"
description = "Sync OPNsense WAN interface IPs to DNS A records through octoDNS providers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "kubernetes>=30.0",
    "octodns>=1.22.0",
    "octodns-desec>=1.3.0",
    "octodns-hetzner>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.22",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
wan-dns-sync = "wan_dns_sync.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["kubernetes.*", "octodns.*"]
ignore_missing_imports = true
